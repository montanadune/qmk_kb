name: Build Keyball61 Right
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Build
        run: |
          qmk setup -y
          qmk compile -kb keyboards/keyball/keyball61_right -km default
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_firmware
          path: ./*.uf2
